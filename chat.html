<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Arideep's AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:        #060614;
  --bg2:       #09091a;
  --bg3:       #0d0d22;
  --bg4:       #11112a;
  --surface:   rgba(255,255,255,.028);
  --surface2:  rgba(255,255,255,.052);
  --surface3:  rgba(255,255,255,.076);
  --border:    rgba(255,255,255,.068);
  --border2:   rgba(255,255,255,.1);

  --pink:   #FF2D75;
  --pink2:  #FF6B9D;
  --violet: #7C3AED;
  --violet2:#A78BFA;
  --cyan:   #06B6D4;
  --cyan2:  #67E8F9;
  --green:  #10B981;
  --amber:  #F59E0B;
  --red:    #EF4444;
  --blue:   #3B82F6;

  --glow-pink:   rgba(255,45,117,.22);
  --glow-violet: rgba(124,58,237,.2);
  --glow-cyan:   rgba(6,182,212,.18);

  --t1: #F1F0FA;
  --t2: #A09BB8;
  --t3: #5C5878;
  --t4: #35324F;

  --font-d: 'Space Grotesk', sans-serif;
  --font-b: 'Inter', sans-serif;
  --font-m: 'JetBrains Mono', monospace;

  --radius:    16px;
  --radius-sm: 10px;
  --radius-xs: 6px;

  --ease-expo:   cubic-bezier(0.16,1,0.3,1);
  --ease-back:   cubic-bezier(0.34,1.56,0.64,1);
  --ease-quart:  cubic-bezier(0.25,1,0.5,1);
}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  font-family:var(--font-b);
  background:transparent;
  color:var(--t1);
}

/* ── BACKGROUND ── */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(124,58,237,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,58,237,.015) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 20%,transparent 75%);
}
.mesh-gradient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh-blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.15;will-change:transform}
.mesh-blob-1{width:600px;height:600px;background:radial-gradient(circle,rgba(255,45,117,.3),transparent 70%);top:-20%;left:-15%;animation:blobFloat1 14s ease-in-out infinite}
.mesh-blob-2{width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,.24),transparent 70%);bottom:-25%;right:-18%;animation:blobFloat2 17s ease-in-out infinite}
.mesh-blob-3{width:450px;height:450px;background:radial-gradient(circle,rgba(6,182,212,.16),transparent 70%);top:40%;left:42%;animation:blobFloat3 12s ease-in-out infinite}
@keyframes blobFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,35px)}}
@keyframes blobFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-45px,-35px)}}
@keyframes blobFloat3{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,28px)}}
.noise-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:200px}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(6,6,20,.65) 100%)}

/* ── ORB ── */
/* FIX: orb starts visible; chatbot starts hidden */
#ai-orb{
  position:fixed;
  right:24px;
  bottom:24px;
  width:70px;
  height:70px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999999;
  color:white;
  font-size:24px;
  background:linear-gradient(135deg,#FF2D75,#7C3AED,#06B6D4);
  box-shadow:0 0 25px rgba(255,45,117,.5),0 0 50px rgba(124,58,237,.3);
  animation:orbPulse 3s infinite;
  transition:opacity .3s ease, transform .3s ease;
}
@keyframes orbPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

/* ── CHATBOT WINDOW ── */
/* FIX: hidden by default, transition on all animating properties */
#chatbot-window{
  position:fixed;
  right:24px;
  bottom:110px;
  width:420px;
  height:700px;
  background:#060614;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  z-index:999998;
  /* FIX: hidden state */
  opacity:0;
  visibility:hidden;
  transform:translateY(20px) scale(.95);
  transition:opacity .3s ease, visibility .3s ease, transform .3s ease;
}
/* FIX: open state */
#chatbot-window.open{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
}

/* ── HEADER ── */
.chat-header{
  position:relative;z-index:10;
  padding:16px 24px;
  background:rgba(9,9,26,.6);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(32px) saturate(1.8);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:14px}
.avatar-wrap{
  position:relative;width:40px;height:40px;flex-shrink:0;
}
.avatar-ring-anim{
  position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--pink),var(--violet),var(--cyan),var(--pink));
  animation:spinRing 6s linear infinite;
}
@keyframes spinRing{to{transform:rotate(360deg)}}
.avatar-ring-inner-bg{position:absolute;inset:1px;border-radius:50%;background:var(--bg2)}
.avatar-img{position:absolute;inset:2px;border-radius:50%;object-fit:cover;object-position:center top;width:calc(100% - 4px);height:calc(100% - 4px)}

.header-info{}
.header-name{font-family:var(--font-d);font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.header-name span{background:linear-gradient(135deg,var(--pink),var(--violet),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-status{display:flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:10px;color:var(--t3);margin-top:3px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(16,185,129,.5);animation:pulse 2.5s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}

.header-right{display:flex;align-items:center;gap:6px}
.header-badge{
  font-family:var(--font-m);font-size:9px;letter-spacing:2px;text-transform:uppercase;
  padding:5px 11px;background:var(--surface);border:1px solid var(--border);border-radius:100px;
  color:var(--t4);
}
.header-badge i{margin-right:5px;color:var(--violet2)}

/* ── MESSAGES AREA ── */
.messages-wrap{
  flex:1;overflow-y:auto;position:relative;z-index:5;
  padding:28px 0 8px;
  scrollbar-width:thin;scrollbar-color:var(--violet) transparent;
}
.messages-wrap::-webkit-scrollbar{width:3px}
.messages-wrap::-webkit-scrollbar-thumb{background:var(--violet);border-radius:2px}

.messages-inner{
  max-width:760px;margin:0 auto;padding:0 24px;
  display:flex;flex-direction:column;gap:20px;
}

/* ── WELCOME STATE ── */
.welcome-block{
  text-align:center;padding:48px 20px 32px;
  animation:fadeUp .8s var(--ease-expo) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.welcome-avatar{
  width:72px;height:72px;border-radius:50%;margin:0 auto 18px;position:relative;
}
.welcome-avatar-ring{
  position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--pink),var(--violet),var(--cyan),var(--pink));
  animation:spinRing 6s linear infinite;
}
.welcome-avatar-bg{position:absolute;inset:1px;border-radius:50%;background:var(--bg2)}
.welcome-avatar img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);border-radius:50%;object-fit:cover;object-position:center top}

.welcome-title{
  font-family:var(--font-d);font-size:26px;font-weight:800;letter-spacing:-1px;
  margin-bottom:8px;
  background:linear-gradient(135deg,#fff 30%,var(--violet2) 65%,var(--pink2) 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.welcome-sub{font-size:13.5px;color:var(--t3);line-height:1.7;margin-bottom:28px;max-width:400px;margin-left:auto;margin-right:auto}

.quick-prompts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:20px}
.qp-btn{
  padding:7px 14px;background:var(--surface);border:1px solid var(--border);border-radius:100px;
  font-family:var(--font-m);font-size:10.5px;color:var(--t2);cursor:pointer;
  transition:border-color .35s var(--ease-expo),color .35s ease,transform .35s var(--ease-back),background .35s ease;
  will-change:transform;
}
.qp-btn:hover{border-color:rgba(124,58,237,.25);color:var(--t1);background:rgba(124,58,237,.06);transform:translateY(-2px)}
.qp-btn i{margin-right:6px;color:var(--violet2)}

/* ── MESSAGE ROWS ── */
.msg-row{
  display:flex;gap:12px;align-items:flex-end;
  animation:msgIn .45s var(--ease-expo) both;
}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.msg-avatar.ai{
  background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.2);
  color:var(--violet2);font-family:var(--font-m);font-size:10px;font-weight:600;
  position:relative;overflow:hidden;
}
.msg-avatar.ai::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,45,117,.04),rgba(124,58,237,.08));
}
.msg-avatar.user-av{
  width:32px;height:32px;border-radius:50%;background:rgba(255,45,117,.1);border:1px solid rgba(255,45,117,.2);
  color:var(--pink2);font-family:var(--font-m);font-size:10px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

.msg-bubble-wrap{max-width:72%;display:flex;flex-direction:column;gap:5px}
.msg-row.user .msg-bubble-wrap{align-items:flex-end}

.msg-bubble{
  padding:12px 16px;border-radius:var(--radius);
  font-size:13.5px;line-height:1.72;position:relative;overflow:hidden;
}
.msg-row.ai .msg-bubble{
  background:rgba(9,9,26,.65);border:1px solid var(--border);
  color:var(--t1);border-bottom-left-radius:4px;
  backdrop-filter:blur(16px);
}
.msg-row.ai .msg-bubble::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.3),transparent);
}
.msg-row.user .msg-bubble{
  background:linear-gradient(135deg,rgba(255,45,117,.18),rgba(124,58,237,.2));
  border:1px solid rgba(124,58,237,.18);
  color:var(--t1);border-bottom-right-radius:4px;
  backdrop-filter:blur(16px);
}

.msg-time{font-family:var(--font-m);font-size:9.5px;color:var(--t4);padding:0 2px}
.msg-row.user .msg-time{text-align:right}

/* Typing indicator */
.typing-bubble{
  display:flex;align-items:center;gap:5px;padding:14px 18px;
  background:rgba(9,9,26,.65);border:1px solid var(--border);border-radius:var(--radius);
  border-bottom-left-radius:4px;backdrop-filter:blur(16px);
  animation:msgIn .45s var(--ease-expo) both;width:fit-content;
}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--violet2);animation:typingBounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-5px);opacity:1}}

/* Code blocks in messages */
.msg-bubble code{
  font-family:var(--font-m);font-size:11.5px;
  background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.15);
  padding:1px 5px;border-radius:4px;color:var(--violet2);
}

/* ── DIVIDER ── */
.section-divider{
  display:flex;align-items:center;gap:12px;padding:4px 0;
}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-label{font-family:var(--font-m);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--t4)}

/* ── INPUT AREA ── */
.input-area{
  position:relative;z-index:10;
  padding:16px 24px 20px;
  background:rgba(9,9,26,.5);
  border-top:1px solid var(--border);
  backdrop-filter:blur(32px);
  flex-shrink:0;
}
.input-area-inner{max-width:760px;margin:0 auto}

.input-row{
  display:flex;align-items:flex-end;gap:10px;
  background:rgba(13,13,34,.7);border:1px solid var(--border);border-radius:14px;
  padding:8px 8px 8px 16px;
  transition:border-color .4s var(--ease-expo),box-shadow .4s var(--ease-expo);
  backdrop-filter:blur(16px);
}
.input-row:focus-within{
  border-color:rgba(124,58,237,.28);
  box-shadow:0 0 0 3px rgba(124,58,237,.06),0 12px 40px rgba(0,0,0,.3);
}
.chat-input{
  flex:1;background:none;border:none;outline:none;resize:none;
  font-family:var(--font-b);font-size:13.5px;color:var(--t1);
  line-height:1.6;max-height:120px;min-height:22px;
  scrollbar-width:none;
}
.chat-input::-webkit-scrollbar{display:none}
.chat-input::placeholder{color:var(--t4)}

.input-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.input-icon-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:9px;color:var(--t3);font-size:13px;
  background:var(--surface);cursor:pointer;
  transition:color .3s ease,border-color .3s ease,transform .35s var(--ease-back);
}
.input-icon-btn:hover{color:var(--t2);border-color:var(--border2);transform:scale(1.08)}

.send-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--pink),var(--violet));
  border-radius:10px;color:#fff;font-size:13px;cursor:pointer;border:none;
  transition:transform .4s var(--ease-back),box-shadow .4s var(--ease-expo),opacity .3s ease;
  box-shadow:0 4px 16px var(--glow-pink);flex-shrink:0;
}
.send-btn:hover{transform:scale(1.1) translateY(-1px);box-shadow:0 8px 24px var(--glow-pink)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

.input-footer{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:0 2px}
.input-hint{font-family:var(--font-m);font-size:9.5px;color:var(--t4)}
.input-hint kbd{
  display:inline-flex;align-items:center;justify-content:center;
  padding:1px 5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:4px;font-size:9px;color:var(--t4);
}
.powered-by{font-family:var(--font-m);font-size:9.5px;color:var(--t4);display:flex;align-items:center;gap:5px}
.powered-by i{color:var(--violet2);font-size:10px}

@media(max-width:600px){
  .messages-inner{padding:0 14px}
  .input-area{padding:12px 14px 16px}
  .msg-bubble-wrap{max-width:82%}
  .chat-header{padding:12px 16px}
}
</style>
</head>
<body>

<!-- BACKGROUNDS -->
<div class="grid-bg"></div>
<div class="mesh-gradient">
  <div class="mesh-blob mesh-blob-1"></div>
  <div class="mesh-blob mesh-blob-2"></div>
  <div class="mesh-blob mesh-blob-3"></div>
</div>
<div class="noise-overlay"></div>
<div class="vignette"></div>

<!-- ORB: lives outside chatbot-window so toggling the window never hides the orb from the DOM -->
<div id="ai-orb">
  <i class="fa-solid fa-sparkles"></i>
</div>

<!-- CHATBOT WINDOW -->
<div id="chatbot-window">

  <!-- HEADER (properly closed) -->
  <header class="chat-header">
    <div class="header-left">
      <div class="avatar-wrap">
        <div class="avatar-ring-anim"></div>
        <div class="avatar-ring-inner-bg"></div>
        <img class="avatar-img" src="Pic.PNG" alt="Arideep" onerror="this.style.display='none'">
      </div>
      <div class="header-info">
        <div class="header-name">Chat with <span>Arideep's AI</span></div>
        <div class="header-status"><span class="status-dot"></span>Arideep Kanshabanik</div>
      </div>
    </div>
    <div class="header-right">
      <button id="closeChat" style="
        width:36px;
        height:36px;
        border:none;
        border-radius:10px;
        background:rgba(255,255,255,.06);
        color:white;
        cursor:pointer;
      ">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </header>
  <!-- ↑ </header> was missing in original -->

  <!-- MESSAGES -->
  <div class="messages-wrap" id="messagesWrap">
    <div class="messages-inner" id="messagesInner">

      <!-- Welcome state -->
      <div class="welcome-block" id="welcomeBlock">
        <div class="welcome-avatar">
          <div class="welcome-avatar-ring"></div>
          <div class="welcome-avatar-bg"></div>
          <img src="Pic.PNG" alt="Arideep" onerror="this.style.display='none'">
        </div>
        <div class="welcome-title">Hey, I'm Arideep's AI</div>
        <div class="welcome-sub">Ask me about Arideep's projects, skills, experience, or anything else you'd like to know. I'm trained on everything on this portfolio.</div>

        <div class="section-divider" style="margin:24px 0 0">
          <div class="divider-line"></div>
          <div class="divider-label">Quick prompts</div>
          <div class="divider-line"></div>
        </div>

        <div class="quick-prompts">
          <button class="qp-btn" onclick="sendQuick(this)"><i class="fa-solid fa-folder-open"></i>Show me your best projects</button>
          <button class="qp-btn" onclick="sendQuick(this)"><i class="fa-solid fa-brain"></i>What AI systems have you built?</button>
          <button class="qp-btn" onclick="sendQuick(this)"><i class="fa-solid fa-shield-halved"></i>Tell me about your cybersecurity work</button>
          <button class="qp-btn" onclick="sendQuick(this)"><i class="fa-solid fa-code"></i>What tech stack do you use?</button>
          <button class="qp-btn" onclick="sendQuick(this)"><i class="fa-solid fa-briefcase"></i>Are you available for hire?</button>
          <button class="qp-btn" onclick="sendQuick(this)"><i class="fa-solid fa-graduation-cap"></i>What's your educational background?</button>
        </div>
      </div>

    </div>
  </div>
  <!-- ↑ .messages-wrap closed -->

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-area-inner">
      <div class="input-row">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="Ask anything about Arideep..."
          rows="1"
          maxlength="2000"
        ></textarea>
        <div class="input-actions">
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
      <div class="input-footer">
        <div class="input-hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
      </div>
    </div>
  </div>

</div>
<!-- ↑ #chatbot-window closing div was missing in original -->

<script>
/* ─────────────────────────────────────────
   ORB ↔ CHATBOT TOGGLE
   FIX: event listeners are attached here, after all DOM elements exist.
   FIX: orb is toggled via display property, not nested inside chatbot-window.
───────────────────────────────────────── */
const orb        = document.getElementById('ai-orb');
const chatWindow = document.getElementById('chatbot-window');
const closeBtn   = document.getElementById('closeChat');

orb.addEventListener('click', () => {
  chatWindow.classList.add('open');
  orb.style.display = 'none';
  // Focus input once window is visible
  setTimeout(() => document.getElementById('chatInput').focus(), 320);
});

closeBtn.addEventListener('click', () => {
  chatWindow.classList.remove('open');
  orb.style.display = 'flex';
});

/* ─────────────────────────────────────────

const conversationHistory = [];
let isLoading = false;

const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');
const messagesInner = document.getElementById('messagesInner');
const messagesWrap  = document.getElementById('messagesWrap');
const welcomeBlock  = document.getElementById('welcomeBlock');

// Auto-resize textarea
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  sendBtn.disabled = !chatInput.value.trim() || isLoading;
});

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

function sendQuick(btn) {
  // Strip the icon text and grab the label text only
  const text = btn.innerText.trim();
  chatInput.value = text;
  chatInput.dispatchEvent(new Event('input'));
  sendMessage();
}

function getTime() {
  return new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:true});
}

function removeWelcome() {
  if (welcomeBlock && welcomeBlock.parentNode) {
    welcomeBlock.style.transition = 'opacity .4s ease, transform .4s var(--ease-expo)';
    welcomeBlock.style.opacity    = '0';
    welcomeBlock.style.transform  = 'translateY(-10px)';
    setTimeout(() => welcomeBlock.remove(), 400);
  }
}

function appendMessage(role, text, animate = true) {
  const isAI = role === 'ai';
  const row   = document.createElement('div');
  row.className = `msg-row ${isAI ? 'ai' : 'user'}`;
  if (!animate) row.style.animation = 'none';

  const avatarHTML = isAI
    ? `<div class="msg-avatar ai">A<span style="color:var(--pink2)">.</span>I</div>`
    : `<div class="msg-avatar user-av">U</div>`;

  const safeText = isAI
    ? formatAIText(text)
    : escapeHTML(text).replace(/\n/g, '<br>');

  row.innerHTML = `
    ${avatarHTML}
    <div class="msg-bubble-wrap">
      <div class="msg-bubble">${safeText}</div>
      <div class="msg-time">${getTime()}</div>
    </div>`;

  messagesInner.appendChild(row);
  scrollToBottom();
  return row;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg-row ai';
  wrap.id = 'typingRow';
  wrap.innerHTML = `
    <div class="msg-avatar ai">A<span style="color:var(--pink2)">.</span>I</div>
    <div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  messagesInner.appendChild(wrap);
  scrollToBottom();
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function scrollToBottom() {
  setTimeout(() => {
    messagesWrap.scrollTo({top: messagesWrap.scrollHeight, behavior: 'smooth'});
  }, 50);
}

function escapeHTML(str) {
  return str
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;');
}

function formatAIText(text) {
  let out = escapeHTML(text);
  // Bold
  out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Inline code
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bullet lists
  out = out.replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>');
  out = out.replace(/(<li>.*<\/li>)/s,
    '<ul style="margin:8px 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">$1</ul>');
  // Newlines → paragraphs
  out = out.replace(/\n{2,}/g, '</p><p style="margin-top:10px">');
  out = out.replace(/\n/g, '<br>');
  return `<p>${out}</p>`;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || isLoading) return;

  removeWelcome();
  isLoading          = true;
  sendBtn.disabled   = true;
  chatInput.value    = '';
  chatInput.style.height = 'auto';

  appendMessage('user', text);
  conversationHistory.push({role: 'user', content: text});

  showTyping();

  try {
    const response = await fetch(
      'https://little-base-afdd.arideepkanshabanik.workers.dev',
      {
        method:  'POST',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify({message: text})
      }
    );

    const data  = await response.json();
    const reply = data.reply || 'Something went wrong. Please try again.';

    removeTyping();
    appendMessage('ai', reply);
    conversationHistory.push({role: 'assistant', content: reply});

  } catch (err) {
    removeTyping();
    appendMessage('ai',
      `Hmm, something broke: ${err.message}. Try refreshing or reach out at **arideepkanshabanik@gmail.com**`
    );
  }

  isLoading        = false;
  sendBtn.disabled = !chatInput.value.trim();
  chatInput.focus();
}
